# 指定 JDK 与 Gradle 内存，避免依赖系统环境变量
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=C:/Users/AA/Documents/deepseek-harness/default-workspace/.build-tools/jdk17

# 本项目**不使用** AndroidX，也不使用 Jetifier。
#
# 历史教训：
#   - 开 enableJetifier=true 会改写依赖字节码（含 sherpa-onnx 的 Kotlin 绑定），
#     曾直接导致启动闪退；
#   - 引入 kotlin-stdlib 会带进 AndroidX 依赖链，同样引发闪退。
# 因此改为在 src/main/java/kotlin/ 下提供最小 Kotlin 兼容层，
# 既不依赖 AndroidX，也不需要 stdlib。
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true
